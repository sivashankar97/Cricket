server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
  gzip_min_length 1024;

  # Flutter file names are not versioned, so browsers revalidate (ETag, 304)
  # on every load; otherwise a deploy could mix old and new files.
  add_header Cache-Control "no-cache" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location / {
    try_files $uri $uri/ /index.html;
  }
}

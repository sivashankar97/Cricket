server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
  gzip_min_length 1024;

  # Flutter file names are not versioned, so browsers revalidate (ETag, 304)
  # on every load; otherwise a deploy could mix old and new files.
  add_header Cache-Control "no-cache" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # WhatsApp login service. Resolved per request (Docker DNS) so this nginx
  # still starts when the wa-login container isn't running.
  location /wa/ {
    resolver 127.0.0.11 valid=30s;
    set $wa_login http://wa-login:3000;
    proxy_pass $wa_login;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header Cache-Control "no-store" always;
    client_max_body_size 256k;
  }
}

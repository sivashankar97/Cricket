  <style>
    html, body { margin: 0; background: #010127; }
    #splash {
      --navy: #010127;
      --red: #F9151D;
      --ease-out: cubic-bezier(.16, 1, .3, 1);
      --ease-in-out: cubic-bezier(.65, 0, .35, 1);
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: var(--navy);
      z-index: 9999;
      transition: opacity 350ms ease-out;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }

    /* Final state is the base style; animations run "both" so they define the start. */
    #splash .glow {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(130vw, 760px, 110vh);
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(closest-side, rgba(249, 21, 29, .22), rgba(249, 21, 29, .07) 55%, rgba(249, 21, 29, 0));
      animation: st-glow 1.6s var(--ease-out) .1s both;
    }
    @keyframes st-glow {
      from { opacity: 0; transform: translate(-50%, -50%) scale(.55); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    #splash .logo {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(58vw, 280px, 40vh);
      transform: translate(-50%, -50%);
      overflow: visible;
    }
    #splash .logo g { transform-box: fill-box; transform-origin: center; }
    #splash #st-mark-move { animation: st-mark-move 1.7s linear both; }
    #splash #st-mark-in { animation: st-mark-in .8s var(--ease-out) .15s both; }
    #splash #st-sports-wipe { animation: st-wipe .75s var(--ease-in-out) 1.3s both; }
    #splash #st-sports { animation: st-rise .75s var(--ease-out) 1.3s both; }
    #splash #st-tamil-wipe { animation: st-wipe .75s var(--ease-in-out) 1.5s both; }
    #splash #st-tamil { animation: st-rise .75s var(--ease-out) 1.5s both; }
    #splash #st-swoosh-wipe { animation: st-wipe .65s var(--ease-out) 1.9s both; }
    #splash #st-swoosh { animation: st-swoosh .65s var(--ease-out) 1.9s both; }
    #splash #st-comma { animation: st-fade-in .5s var(--ease-out) 2.1s both; }
    #splash #st-dot { animation: st-fade-in .5s var(--ease-out) 2.25s both; }

    @keyframes st-mark-in {
      from { opacity: 0; transform: scale(.7); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes st-mark-move {
      0%, 58.8% {
        transform: translate(-12px, 111px) scale(.62);
        animation-timing-function: var(--ease-in-out);
      }
      100% { transform: translate(0, 0) scale(1); }
    }
    @keyframes st-wipe { from { transform: translateX(0); } to { transform: translateX(460px); } }
    @keyframes st-rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes st-swoosh { from { transform: translateX(-16px); } to { transform: translateX(0); } }
    @keyframes st-fade-in {
      from { opacity: 0; transform: scale(.6); }
      to { opacity: 1; transform: scale(1); }
    }

    #splash .loading {
      position: absolute;
      left: 50%;
      bottom: 12vh;
      display: flex;
      gap: 8px;
      transform: translateX(-50%);
      opacity: 0;
      animation: st-show .4s ease-out 3.6s forwards;
    }
    #splash .loading span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .85);
      animation: st-dots 1.2s ease-in-out infinite;
    }
    #splash .loading span:nth-child(2) { animation-delay: .15s; }
    #splash .loading span:nth-child(3) { animation-delay: .3s; }
    @keyframes st-show { to { opacity: 1; } }
    @keyframes st-dots { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      #splash *, #splash .logo g, #splash .logo path { animation: none !important; }
      #splash .loading { opacity: 1; }
    }
  </style>
